# Default values = DEV / local cluster. Reproduces the live dclaw-core deployment.
# Plain `helm install dclaw-crisis ./helm -n dclaw-core` brings the app up.
# For the cloud/GHCR deployment, override with: -f values-prod.yaml

nameOverride: ""

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-crisis-backend
    tag: local
    pullPolicy: Never
  containerPort: 18149
  service:
    type: ClusterIP
    port: 18149
  env: {}
  livenessProbe:
    path: /health/
    initialDelaySeconds: 15
    periodSeconds: 30
  readinessProbe:
    path: /health/
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-crisis-frontend
    tag: local
    pullPolicy: Never
  containerPort: 3079
  service:
    type: NodePort
    port: 3079
    nodePort: 30050
  env:
    PORT: "3079"
    BACKEND_URL: http://dclaw-crisis-backend:18149
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

secret:
  name: ""
  data:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@dclaw-shared-postgres:5432/dclaw_crisis
    APP_ENV: production
    SECRET_KEY: dclaw-crisis-local-secret-key
    ENABLE_DEMO_MODE: "true"
    MINIO_DISABLED: "true"
    REDIS_DISABLED: "true"

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls: []
