global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: dclaw-crisis
    env: dev

scrape_configs:
  - job_name: dclaw-crisis-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8061"]

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
